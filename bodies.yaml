      - { key: wausau-capital-improvement, name: Capital Improvement Projects Committee, match: "capital improvement project" }
      - { key: wausau-ethics-board, name: Ethics Board, match: "ethics board" }
      - { key: wausau-bid-board, name: Business Improvement District Board, match: "business improvement district" }
      - { key: wausau-board-of-review, name: Board of Review, match: "board of review" }
      - { key: wausau-joint-review-board, name: Joint Review Board, match: "joint review board" }
      - { key: wausau-rules-review, name: Rules Review Committee, match: "rules review" }
      - { key: wausau-affordable-housing-task-force, name: Affordable Housing Regional Task Force, match: "affordable housing regional task force",
          custodian: unknown,
          confirm: "Regional body. Is it a governmental body under s. 19.82(1), and who keeps its records?" }
      - { key: marathon-park-commission, name: Marathon County Park Commission, match: "marathon county parks? commission",
          custodian: Marathon County,
          confirm: "A county body posted on the city's portal. Report it under Marathon County?" }
