# bodies.yaml — every governmental body the Closed Door Ledger covers.
#
# Each committee, commission and board is its own governmental body under
# s. 19.82(1), so results are reported per body, grouped by jurisdiction.
#
# Matching rules (one way, applied in this order):
#   1. Normalize the title: strip leading "*", "REVISED" and "CANCELED"/"CANCELLED"
#      markers (with any following "-" or ":"). "Canceled"/"cancellation" anywhere in a
#      title sets canceled: true.
#      "SPECIAL" is NOT stripped.
#   2. A normalized title matching a jurisdiction's `exclude` pattern is not a
#      meeting of any body (quorum notices, test events). It is skipped.
#   3. `overrides` (meeting id -> body key, list of keys, or "exclude") wins over
#      patterns. Generic titles such as Wausau SD's "Public Meeting" are mapped here
#      one by one, by their first agenda item.
#   4. Otherwise the title must match exactly ONE body's `match` pattern
#      (case-insensitive Python regex). A title matching several bodies counts
#      for each of them only if it contains "joint"; any other multi-match FAILS
#      THE BUILD until an override says which bodies met.
#   5. AgendaCenter bodies match on `category_id` instead of a title.
#   6. A meeting that matches no body FAILS THE BUILD.
#
# `custodian:` names who keeps a body's records when it isn't the jurisdiction
# whose portal posts the notice. The quarterly audit groups requests by custodian.
# `confirm:` marks an open editor decision. Bodies with `confirm:` are archived
# but NOT published until the key is removed.
#
# Seeded Oct 23, 2026 from every meeting title the platforms list for
# Jan 2024–Oct 2026 (Wausau 753, Wausau SD 184, D.C. Everest 46, Kronenwetter 295).
# Bodies with no `match` are reached only through overrides.

window_start: 2024-01-01

