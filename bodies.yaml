      - { key: wausau-room-tax, name: Room Tax Commission, match: "room tax" }
      - { key: wausau-building-advisory, name: Building Advisory Board, match: "building advisory" }
      - { key: wausau-zoning-appeals, name: Board of Zoning Appeals, match: "zoning appeals" }
      - { key: wausau-board-of-canvassers, name: Municipal Board of Canvassers, match: "board of canvassers" }
