# The nightly ledger run: re-check the last 90 days and upcoming meetings,
# rebuild, push the archive, and deploy the site as a Pages artifact.
# The Jan 2024 backfill ran once, locally; this never re-runs it.
name: ledger

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC, early morning Central
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The private archive is always checked out at archive/ (CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          repository: RowanFlynnPilot/wpr-closed-door-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests -q

      - name: Fetch the last 90 days and upcoming meetings
        run: python fetch.py --recent

      - name: Build
        run: python build.py

      - name: Commit the archive
        working-directory: archive
        run: |
          git config user.name "wpr-closed-door-ledger[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Nightly run $(date -u +%Y-%m-%dT%H:%MZ)"

      # No file over 50 MB and the repo under 1 GB, or stop (CLAUDE.md).
      - name: Check limits and push the archive
        run: python archive_check.py --push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
